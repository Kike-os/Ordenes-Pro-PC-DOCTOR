# Respaldo diario cifrado de la base central de Órdenes Pro en Microsoft OneDrive (1.5.309).
# Se ejecuta a las 02:00 de Ecuador (07:00 UTC) aunque el equipo de la oficina esté apagado, y a petición desde
# Configuración → Respaldos («Realizar respaldo ahora», «Verificar respaldo», «Restaurar respaldo» en entorno aislado).
# GitHub puede retrasar unos minutos las tareas programadas; la alerta de respaldo atrasado tiene margen para ello (30 h).
name: Respaldo OneDrive

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'respaldo, verificar o restaurar (prueba aislada)'
        required: true
        default: respaldo
        type: choice
        options: [respaldo, verificar, restaurar]
      archivo:
        description: 'Nombre del respaldo (solo para verificar o restaurar)'
        required: false
        default: ''
      solicitud:
        description: 'Identificador de la solicitud hecha desde el panel'
        required: false
        default: ''

# Nunca dos respaldos a la vez (además del bloqueo que se guarda en la base).
concurrency:
  group: respaldo-onedrive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install --quiet -r maintenance/requirements-respaldo.txt
      - name: Respaldo, verificación o restauración aislada
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          ONEDRIVE_TOKEN_KEY: ${{ secrets.ONEDRIVE_TOKEN_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MODO: ${{ github.event.inputs.modo || 'respaldo' }}
          ARCHIVO: ${{ github.event.inputs.archivo || '' }}
          SOLICITUD: ${{ github.event.inputs.solicitud || '' }}
        run: |
          # Sin los secretos cargados (configuración inicial pendiente) no se intenta nada: aviso claro en lugar de un fallo diario.
          # La aplicación sigue mostrando la alerta real «Respaldo atrasado» mientras no haya respaldos verificados.
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$BACKUP_ENCRYPTION_KEY" ] || [ -z "$MS_CLIENT_ID" ]; then
            echo "::warning::Respaldos en OneDrive sin configurar: faltan secretos (ver docs/RESPALDOS-ONEDRIVE.md)."
            exit 0
          fi
          python maintenance/backup-cloud.py --modo "$MODO" --archivo "$ARCHIVO" --solicitud "$SOLICITUD"
